name: Feature request
description: Suggest something Aule should do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What should a child, parent, teacher or builder be able to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
  - type: checkboxes
    id: kids
    attributes:
      label: Children first
      options:
        - label: This keeps the hardware microphone mute meaningful and does not collect more than it needs.
          required: true
